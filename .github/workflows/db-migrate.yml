name: Apply Supabase Migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/app-build-from-specs-m683r7
    paths:
      - 'supabase/migrations/**'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --project-ref kzyddmejffqrjpwwduyo
